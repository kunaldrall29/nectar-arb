[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["../../contracts/lib"]
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
fs_permissions = [
  { access = "read-write", path = "../../deployments" },
  { access = "read-write", path = "/workspace/deployments" }
]

remappings = [
  "@openzeppelin/contracts/=../../contracts/lib/openzeppelin-contracts/contracts/",
  "forge-std/=../../contracts/lib/forge-std/src/"
]

[rpc_endpoints]
local = "http://127.0.0.1:8545"
arbitrum_sepolia = "https://sepolia-rollup.arbitrum.io/rpc"
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"

[fmt]
line_length = 120
