[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
ffi = false

[rpc_endpoints]
arbitrum_sepolia = "${ARB_SEPOLIA_RPC_URL}"
localhost = "http://127.0.0.1:8545"

[etherscan]
arbitrum_sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api-sepolia.arbiscan.io/api" }
