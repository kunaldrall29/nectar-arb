[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
fs_permissions = [{ access = "read-write", path = "./" }, { access = "read-write", path = "../deployments" }]
verbosity = 2
ffi = false

[profile.default.fuzz]
runs = 256

[rpc_endpoints]
arbitrum_sepolia = "${ARB_SEPOLIA_RPC}"
anvil = "http://127.0.0.1:8545"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
