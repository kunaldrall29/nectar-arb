[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read-write", path = "../deployments" }, { access = "read", path = "./out" }]

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 32
fail_on_revert = false

[rpc_endpoints]
local = "http://127.0.0.1:8545"
arbitrum_sepolia = "https://sepolia-rollup.arbitrum.io/rpc"
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"

[lint]
lint_on_build = false
