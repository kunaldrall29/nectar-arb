[package]
name = "nectar_executor"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
nectar_token = { path = "../nectar_token" }
quote_escrow = { path = "../quote_escrow" }
mock_lending = { path = "../mock_lending" }
